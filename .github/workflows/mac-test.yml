# Mac（Apple Silicon）の上で、試験（pnpm test の画面・計算と Rust）を動かす。Actions の画面から手で動かす（workflow_dispatch）。
# Mac の許可（アクセシビリティ・画面収録）が要る確かめ（フック・撮影）と、Mac の文字認識は、ここでは動かせない（analysis/mac の段階 3・4）。
name: mac-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # pnpm の版は、ルートの package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # 実ブラウザの検査は、ランナーに入っている Chrome を使う
      - name: 画面と計算の試験
        run: pnpm test:ts

      # 画面の試験が落ちても、Rust の試験の結果も見る
      - name: Rust の試験
        if: ${{ !cancelled() }}
        run: pnpm test:rust
