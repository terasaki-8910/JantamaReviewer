[package]
name = "jantama-helper"
version = "0.1.0"
description = "管理者で動くボタンの補助プログラム: 入力を拾って本体に知らせるだけ（画面・ネット・ファイルは扱わない）"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "jantama-helper"
path = "src/main.rs"

# 依存は、共有の部品（jantama-input）と windows クレートだけ。tests/safety.rs が一覧を確かめる。
[dependencies]
jantama-input = { path = "../input" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
