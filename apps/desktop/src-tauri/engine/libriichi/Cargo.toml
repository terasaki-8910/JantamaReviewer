# Mortal（https://github.com/Equim-chan/Mortal、コミット 0cff2b5）の libriichi を、Python なしで使う形にしたもの。
# 元の Cargo.toml から、Python の部品（pyo3・numpy・pyo3-log・pyo3-build-config）と、エンジンで使わない部品
# （indicatif・mimalloc・criterion と bench）を外した。変えた所は ../README.md に書く。
[package]
name = "libriichi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "riichi"

[dependencies]
anyhow = "1"
log = "0.4"
serde_json = "1"
boomphf = "0.6"
byteorder = "1"
rayon = "1"
ndarray = "0.16"
serde_with = "3"
rand = "0.9"
rand_chacha = "0.9"
flate2 = "1"
sha3 = "0.10"
glob = "0.3"
derivative = "2"
ahash = "0.8"
parking_lot = "0.12"
crossbeam = "0.8"
tinyvec = { version = "1", features = ["alloc", "serde", "rustc_1_57"] }
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["add", "add_assign", "sum"] }

[features]
sp_reproduce_cpp_ver = []
