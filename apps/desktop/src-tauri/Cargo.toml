[package]
name = "jantama-reviewer"
version = "0.1.0"
description = "雀魂の半荘を、AIの答えを見る前に自分の考えを確定させて検討するための個人用ツール"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "jantama_reviewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# PNG の書き出し専用（画像の解析には使わない。S-3）
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

# 依存クレートは最適化する（PNG の圧縮がデバッグビルドで遅いと、迷いマークの記録が遅れる）
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
