[package]
name = "jantama-reviewer"
version = "0.1.0"
description = "雀魂の半荘を、AIの答えを見る前に自分の考えを確定させて検討するための個人用ツール"
license = "MIT"
edition = "2021"
# tauri-plugin-opener が 1.90 以上を要る。
rust-version = "1.90"
publish = false

[lib]
name = "jantama_reviewer_lib"
crate-type = ["rlib"]

# 本体（このパッケージ）と、管理者で動くボタンの補助プログラム（helper）、2 つが共有する部品（input）、
# 取り込みのときだけ使う文字認識（ocr）。
# `cargo build` で本体と補助プログラムの両方を作る（default-members）。
[workspace]
members = ["input", "helper", "ocr"]
default-members = [".", "helper"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# PNG の書き出し専用（画像の解析には使わない。S-3）
png = "0.18"
# 既定のブラウザで URL を開く（N-5）。プラグインとして登録はせず、external.rs の 1 か所からだけ呼ぶ。
# 開く前に http / https の外部ページだけに絞る。通信はしない（tests/safety.rs の許可の一覧に理由つきで載せている）。
tauri-plugin-opener = "2"
# 画面の遷移先の判定（navigation.rs）。URL の文字列を調べるだけ。
url = "2"
# ボタンを拾う部品（判定・補助プログラムとの連絡・Windows のフックとパイプ）。補助プログラムと共有する。
jantama-input = { path = "input" }
# 取り込みのときだけ使う文字認識（保存済みのスクリーンショットを読む。S-3）。src/import/ocr_job.rs の 1 か所からだけ使う。
jantama-ocr = { path = "ocr" }
# 結果 JSON の取得（GET の 1 種類だけ）。src/import/report_fetch.rs の 1 か所からだけ使う（S-2）。
# TLS は OS のもの（native-tls。Windows は SChannel、macOS は Security.framework）。同梱の証明書の一覧を持たず、OS の信頼する証明書を使う。
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# 答え・解き直しの予定・今日の出題を置く SQLite（D-3。保存先の study.sqlite）。SQLite 本体は同梱（bundled）で、通信はしない。
# src/study/ の中だけで使う（検討画面だけが使う。ウィジェット・ボタンを拾う部分・補助プログラムには入れない）。
rusqlite = { version = "0.40", features = ["bundled"] }

# 記録の同期（F15、D-4）。手元の SQLite と JSON が元の記録のままで、同期用の DB を別に持ち、Turso Cloud と同期する。
# src/sync/ の中だけで使う（通信するのは、ここだけ。tests/safety.rs の S-2 が、通信先と使える場所を確かめる）。
# 版は 0.8.2 に固定する: 同期の試し（analysis/sync-spike）で Turso Cloud（東京）と、同じ版の tursodb --sync-server に対して、
# 競合・削除・オフライン・時間切れを確かめた版だから。0.8.3 は 2026-10-12 に出たばかりで、Cloud に対しては確かめていない。
# 既定の機能（mimalloc・全文検索）は切る。
turso = { version = "=0.8.2", default-features = false, features = ["sync"] }
# turso の同期が使う非同期の実行環境（同期の裏のスレッドが 1 つだけ持つ）。
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# トークンを入れる OS の資格情報の保管庫（Windows の資格情報マネージャー、Mac のキーチェーン）。ファイルには書かない。
keyring = "4"
# report.json の圧縮（gzip）と、内容の指紋（SHA-256）。
flate2 = "1"
sha2 = "0.10"
# 端末をまたいで重ならない id の乱数。
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# クリップボードの文字を読む（文字だけ。画像やファイルは読まない）。src/platform/win/clipboard.rs の 1 か所からだけ使う。
clipboard-win = "5"
# WebView2 の設定を変える（src/platform/win/webview.rs）。Tauri（wry 0.57）が使う版にそろえる。
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# macOS の部品（src/platform/mac）。いまの機能は、クリップボードの文字の読み取りと、ごみ箱への移し替えだけ。
# どちらも、tao・wry を通して依存の一覧に入っている版（Cargo.lock）のまま。使う機能（features）だけを宣言する。
# 画面・入力・ほかのプロセスに触れる部品は、ここに宣言しない（tests/safety.rs の macOS の部品の検査）。
[target.'cfg(target_os = "macos")'.dependencies]
# NSFileManager の trashItemAtURL（src/platform/mac/trash.rs の 1 か所からだけ使う）。
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
# NSPasteboard の文字の読み取り（src/platform/mac/clipboard.rs の 1 か所からだけ使う）。
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"

# フックの結合試験（tests/hook_integration.rs）が、マウスとキーの入力を注入するのに使う。
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

# 依存クレートは最適化する（PNG の圧縮がデバッグビルドで遅いと、迷いマークの記録が遅れる）
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
